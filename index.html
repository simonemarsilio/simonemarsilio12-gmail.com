<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Benzina Radar"/>
  <meta name="theme-color" content="#f2f2f7"/>
  <title>Benzina Radar</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;}
    :root{
      --bg:#f2f2f7;--bg2:#fff;--bg3:#e5e5ea;--bg4:#d1d1d6;
      --label:#000;--label2:#3c3c43;--label3:rgba(60,60,67,.6);--label4:rgba(60,60,67,.18);
      --sep:rgba(60,60,67,.29);
      --blue:#007aff;--green:#34c759;--yellow:#ff9f0a;--orange:#ff6b00;--red:#ff3b30;--lime:#30d158;--purple:#af52de;
      --safe-top:env(safe-area-inset-top,44px);--safe-bottom:env(safe-area-inset-bottom,20px);
    }
    html,body{height:100%;overflow:hidden;background:var(--bg);}
    #app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;}

    .status-spacer{height:calc(var(--safe-top) + 4px);background:rgba(242,242,247,.95);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);flex-shrink:0;}

    .navbar{background:rgba(242,242,247,.95);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:8px 16px 10px;flex-shrink:0;border-bottom:.5px solid var(--sep);}
    .navbar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .app-title{font-size:17px;font-weight:600;letter-spacing:-.4px;}

    .top-right{display:flex;gap:7px;align-items:center;}

    /* Fuel toggle */
    .fuel-toggle{display:flex;background:var(--bg3);border-radius:8px;padding:2px;gap:2px;}
    .fuel-btn{padding:5px 12px;border-radius:6px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--label3);transition:all .2s;letter-spacing:-.2px;}
    .fuel-btn.active{background:var(--bg2);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12);}

    .btn-loc{display:flex;align-items:center;gap:5px;border:none;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;transition:opacity .15s;letter-spacing:-.2px;}
    .btn-loc:active{opacity:.7;}
    .btn-loc:disabled{opacity:.4;}

    .radius-row{display:flex;gap:7px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .radius-row::-webkit-scrollbar{display:none;}
    .radius-label{font-size:12px;color:var(--label3);font-weight:500;white-space:nowrap;}
    .pill-group{display:flex;gap:5px;}
    .pill{padding:4px 10px;border-radius:14px;font-size:13px;font-weight:500;background:var(--bg3);color:var(--label2);border:none;cursor:pointer;white-space:nowrap;transition:all .15s;}
    .pill.active{background:var(--blue);color:#fff;}
    .pill:active{opacity:.7;}

    #map{flex:1;min-height:0;z-index:0;}
    .leaflet-control-attribution{font-size:9px !important;}
    .leaflet-control-zoom{display:none;}

    .map-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;}

    .search-here-btn{
      position:absolute;top:12px;left:50%;transform:translateX(-50%);
      z-index:500;background:var(--bg2);color:var(--blue);
      border:none;border-radius:20px;padding:8px 18px;
      font-size:14px;font-weight:600;letter-spacing:-.2px;
      box-shadow:0 2px 12px rgba(0,0,0,.18);cursor:pointer;
      display:none;white-space:nowrap;transition:opacity .15s;
    }
    .search-here-btn:active{opacity:.7;}
    .search-here-btn.visible{display:block;}

    /* SHEET */
    .sheet{
      position:absolute;bottom:0;left:0;right:0;background:var(--bg2);
      border-radius:13px 13px 0 0;box-shadow:0 -1px 0 var(--sep),0 -8px 24px rgba(0,0,0,.1);
      z-index:1000;transition:transform .42s cubic-bezier(.32,.72,0,1);
      max-height:85dvh;display:flex;flex-direction:column;
    }
    .sheet.collapsed{transform:translateY(calc(100% - 80px));}
    .sheet.peek{transform:translateY(calc(100% - 260px));}
    .sheet.expanded{transform:translateY(0);}

    .sheet-handle-wrap{padding:10px 0 4px;display:flex;justify-content:center;flex-shrink:0;cursor:pointer;}
    .sheet-handle{width:36px;height:5px;border-radius:3px;background:var(--label4);}
    .sheet-header{padding:0 16px 10px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
    .sheet-title{font-size:17px;font-weight:700;letter-spacing:-.4px;}
    .sheet-count{font-size:13px;color:var(--label3);}

    /* DETAIL */
    .detail-panel{padding:0 16px 14px;border-bottom:.5px solid var(--sep);display:none;flex-shrink:0;max-height:55dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .detail-panel.visible{display:block;}
    .detail-name{font-size:17px;font-weight:700;letter-spacing:-.4px;margin-bottom:2px;}
    .detail-addr{font-size:13px;color:var(--label3);margin-bottom:10px;}

    .detail-scores{display:flex;gap:8px;margin-bottom:10px;}
    .dscore{flex:1;border-radius:10px;padding:9px 11px;}
    .dscore-label{font-size:10px;font-weight:600;color:var(--label3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
    .dscore-row{display:flex;align-items:center;gap:7px;}
    .dscore-num{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1;}
    .dscore-right{flex:1;}
    .dscore-bar-bg{height:3px;background:rgba(0,0,0,.08);border-radius:2px;overflow:hidden;margin-bottom:3px;}
    .dscore-bar{height:100%;border-radius:2px;}
    .dscore-verdict{font-size:10px;font-weight:700;}

    .detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
    .tag{display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600;}
    .tag-pay-yes{background:rgba(175,82,222,.12);color:var(--purple);}
    .tag-pay-no{background:rgba(60,60,67,.1);color:var(--label3);}
    .tag-pay-unk{background:rgba(60,60,67,.07);color:var(--label3);}
    .tag-self{background:rgba(0,122,255,.1);color:var(--blue);}
    .tag-att{background:rgba(52,199,89,.1);color:var(--green);}
    .tag-white{background:rgba(255,159,10,.1);color:var(--yellow);}

    .review-box{background:var(--bg);border-radius:10px;padding:11px 12px;margin-bottom:10px;}
    .review-title{font-size:11px;font-weight:700;color:var(--label3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;}
    .review-text{font-size:13px;color:var(--label2);line-height:1.6;}
    .review-loading{color:var(--label3);font-style:italic;font-size:13px;}
    .review-sources{font-size:11px;color:var(--label3);margin-top:6px;line-height:1.5;}

    .nav-section{margin-bottom:8px;}
    .nav-section-label{font-size:11px;font-weight:600;color:var(--label3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:7px;}
    .nav-btns{display:flex;gap:7px;}
    .nav-btn{flex:1;padding:11px 6px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:4px;transition:opacity .15s;letter-spacing:-.1px;}
    .nav-btn:active{opacity:.7;}
    .nav-apple{background:var(--blue);color:#fff;}
    .nav-google{background:#34a853;color:#fff;}
    .nav-waze{background:#33ccff;color:#000;}

    .copy-btn{width:100%;padding:11px;border-radius:10px;border:none;background:var(--bg3);color:var(--label2);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;margin-top:0;}
    .copy-btn:active{opacity:.7;}
    .copy-btn.copied{background:rgba(52,199,89,.15);color:var(--green);}

    /* LIST */
    .station-scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 8px);}
    .station-item{padding:12px 16px;border-bottom:.5px solid var(--sep);cursor:pointer;background:var(--bg2);transition:background .1s;}
    .station-item:active{background:var(--bg3);}
    .station-item.selected{background:rgba(0,122,255,.06);}

    .si-row1{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
    .brand-badge{width:36px;height:36px;border-radius:9px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--label2);flex-shrink:0;}
    .si-meta{flex:1;min-width:0;}
    .si-name{font-size:15px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .si-addr{font-size:11px;color:var(--label3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
    .si-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
    .si-dist{font-size:12px;color:var(--label3);font-weight:500;}
    .si-pay{font-size:15px;line-height:1;}

    /* Single fuel score card */
    .fuel-score-card{border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;}
    .fsc-num{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1;}
    .fsc-right{flex:1;}
    .fsc-bar-bg{height:4px;background:rgba(0,0,0,.08);border-radius:2px;overflow:hidden;margin-bottom:4px;}
    .fsc-bar{height:100%;border-radius:2px;}
    .fsc-verdict{font-size:12px;font-weight:700;}
    .fsc-label{font-size:10px;font-weight:600;color:var(--label3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;}

    /* STATES */
    .sheet-empty{padding:28px 16px;text-align:center;}
    .sheet-empty-title{font-size:16px;font-weight:600;margin-bottom:5px;}
    .sheet-empty-sub{font-size:13px;color:var(--label3);line-height:1.5;}
    .loader{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px;color:var(--label3);font-size:14px;}
    .spinner{width:18px;height:18px;border:2px solid var(--bg3);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* MARKERS */
    .marker-pin{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.28);border:2.5px solid #fff;cursor:pointer;transition:transform .2s,box-shadow .2s;}
    .marker-pin.selected{transform:scale(1.3);box-shadow:0 4px 16px rgba(0,0,0,.32);}
    .user-dot{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 4px rgba(0,122,255,.22);}

    .c-red{color:var(--red)}.f-red{background:var(--red)}.bg-red{background:rgba(255,59,48,.1)}
    .c-orange{color:var(--orange)}.f-orange{background:var(--orange)}.bg-orange{background:rgba(255,107,0,.1)}
    .c-yellow{color:var(--yellow)}.f-yellow{background:var(--yellow)}.bg-yellow{background:rgba(255,159,10,.1)}
    .c-lime{color:var(--lime)}.f-lime{background:var(--lime)}.bg-lime{background:rgba(48,209,88,.1)}
    .c-green{color:var(--green)}.f-green{background:var(--green)}.bg-green{background:rgba(52,199,89,.1)}
  </style>
</head>
<body>
<div id="app">
  <div class="status-spacer"></div>
  <div class="navbar">
    <div class="navbar-top">
      <div class="app-title">⛽ Benzina Radar</div>
      <div class="top-right">
        <div class="fuel-toggle">
          <button class="fuel-btn active" id="fbBenzina" onclick="setFuel('benzina',this)">Benzina</button>
          <button class="fuel-btn" id="fbDiesel" onclick="setFuel('diesel',this)">Diesel</button>
        </div>
        <button class="btn-loc" id="btnLoc" onclick="locateMe()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        </button>
      </div>
    </div>
    <div class="radius-row">
      <span class="radius-label">Raggio</span>
      <div class="pill-group">
        <button class="pill" onclick="setRadius(1,this)">1 km</button>
        <button class="pill" onclick="setRadius(2,this)">2 km</button>
        <button class="pill active" onclick="setRadius(5,this)">5 km</button>
        <button class="pill" onclick="setRadius(10,this)">10 km</button>
        <button class="pill" onclick="setRadius(20,this)">20 km</button>
      </div>
    </div>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <button class="search-here-btn" id="searchHereBtn" onclick="searchHere()">🔍 Cerca in quest'area</button>
  </div>

  <div class="sheet collapsed" id="sheet">
    <div class="sheet-handle-wrap" onclick="toggleSheet()"><div class="sheet-handle"></div></div>
    <div class="sheet-header" onclick="toggleSheet()">
      <div class="sheet-title" id="sheetTitle">Distributori vicini</div>
      <div class="sheet-count" id="sheetCount"></div>
    </div>

    <div class="detail-panel" id="detailPanel">
      <div class="detail-name" id="detailName"></div>
      <div class="detail-addr" id="detailAddr"></div>
      <div id="detailScoreCard" style="margin-bottom:10px;"></div>
      <div class="detail-tags" id="detailTags"></div>
      <div class="review-box">
        <div class="review-title">📊 Analisi AI</div>
        <div class="review-text" id="reviewText"><span class="review-loading">Ricerca recensioni in corso…</span></div>
        <div class="review-sources" id="reviewSources"></div>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">Naviga con</div>
        <div class="nav-btns">
          <button class="nav-btn nav-apple" onclick="doNav('apple')">🗺 Apple</button>
          <button class="nav-btn nav-google" onclick="doNav('google')">🌍 Google</button>
          <button class="nav-btn nav-waze" onclick="doNav('waze')">🚗 Waze</button>
        </div>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyAddress()">📋 Copia indirizzo</button>
    </div>

    <div class="station-scroll">
      <div class="sheet-empty" id="sheetEmpty">
        <div class="sheet-empty-title">Nessuna ricerca</div>
        <div class="sheet-empty-sub">Premi 📍 per trovare distributori<br>vicino a te</div>
      </div>
      <div id="loaderEl" style="display:none"><div class="loader"><div class="spinner"></div><span id="loaderText">Analisi in corso…</span></div></div>
      <div id="stationList"></div>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let map, userMarker, stationMarkers=[], stations=[], selectedIdx=null, currentStation=null;
let userLat=null, userLon=null, radiusKm=5;
let sheetState='collapsed';
let activeFuel='benzina';
let searchMode='locate'; // 'locate' | 'area'

// ── MAP INIT ──
map=L.map('map',{zoomControl:false}).setView([45.48,12.23],12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19
}).addTo(map);

map.on('movestart',()=>{
  if(stations.length>0){
    document.getElementById('searchHereBtn').classList.add('visible');
    searchMode='area';
  }
});
map.on('click',e=>{
  if(e.originalEvent.target.classList.contains('marker-pin')) return;
  if(sheetState==='expanded') setSheet('peek');
  deselectAll();
});

// ── AUTO LOCATE ON LOAD ──
window.addEventListener('load',()=>{ if(navigator.geolocation) locateMe(); });

// ── SHEET ──
function setSheet(s){ sheetState=s; document.getElementById('sheet').className=`sheet ${s}`; }
function toggleSheet(){
  if(sheetState==='collapsed') setSheet('peek');
  else if(sheetState==='peek') setSheet('expanded');
  else setSheet('peek');
}

// ── FUEL TOGGLE ──
function setFuel(f,btn){
  activeFuel=f;
  document.querySelectorAll('.fuel-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(stations.length>0){ updatePins(); updateList(); }
}

// ── RADIUS ──
function setRadius(km,btn){
  radiusKm=km;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
}

// ── HELPERS ──
function kmDist(a,b,c,d){
  const R=6371,dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function fmtDist(km){ return km<1?`${Math.round(km*1000)} m`:`${km.toFixed(1)} km`; }

function brandLabel(n,b){
  const s=(n+b).toLowerCase();
  if(s.includes('eni')||s.includes('agip')) return 'ENI';
  if(s.includes('q8')||s.includes('kuwait')) return 'Q8';
  if(s.includes('total')) return 'TTE';
  if(s.includes('shell')) return 'SHL';
  if(s.includes('tamoil')) return 'TAM';
  if(s.includes('esso')||s.includes('exxon')) return 'ESO';
  if(s.includes('api')) return 'API';
  if(s.includes('italiana petrol')||s.includes(' ip ')) return 'IP';
  return '⛽';
}

function isWhite(n,b){
  const s=(n+b).toLowerCase();
  return !['eni','agip','q8','kuwait','total','shell','tamoil','esso','exxon','italiana petrol','api'].some(k=>s.includes(k));
}

function scoreColor(s){
  if(s>=4.5) return 'green';
  if(s>=3.5) return 'lime';
  if(s>=2.5) return 'yellow';
  if(s>=1.5) return 'orange';
  return 'red';
}
function scoreVerdict(s){
  if(s>=4.5) return 'Ottimo';
  if(s>=3.5) return 'Buono';
  if(s>=2.5) return 'Discreto';
  if(s>=1.5) return 'Dubbioso';
  return 'Evita';
}

function activeScore(s){ return activeFuel==='benzina'?s.benzina:s.diesel; }

function pinColor(score){
  if(score>=4.5) return '#34c759';
  if(score>=3.5) return '#30d158';
  if(score>=2.5) return '#ff9f0a';
  if(score>=1.5) return '#ff6b00';
  return '#ff3b30';
}

function parsePayment(tags){
  if(!tags) return 'unknown';
  if(['payment:contactless','payment:nfc','payment:apple_pay','payment:credit_cards'].some(k=>tags[k]==='yes')) return 'yes';
  if(tags['payment:contactless']==='no'||tags['payment:cash_only']==='yes') return 'no';
  return 'unknown';
}
function parseAttended(tags){
  if(!tags) return 'unknown';
  if(tags['attended']==='yes') return 'attended';
  if(tags['self_service']==='yes') return 'self';
  return 'unknown';
}
function payIcon(pay){
  if(pay==='yes') return '💳';
  if(pay==='no') return '💵';
  return '❓';
}
function buildAddress(tags){
  if(!tags) return '';
  const p=[];
  if(tags['addr:street']) p.push(tags['addr:street']);
  if(tags['addr:housenumber']) p.push(tags['addr:housenumber']);
  if(tags['addr:city']) p.push(tags['addr:city']);
  return p.join(', ')||'';
}

// ── LOCATE ME ──
function locateMe(){
  const btn=document.getElementById('btnLoc');
  btn.disabled=true;
  searchMode='locate';
  document.getElementById('searchHereBtn').classList.remove('visible');
  navigator.geolocation.getCurrentPosition(pos=>{
    userLat=pos.coords.latitude; userLon=pos.coords.longitude;
    placeUserMarker(userLat,userLon);
    btn.disabled=false;
    searchFromPoint(userLat,userLon,true);
  },()=>{
    btn.disabled=false;
    alert('GPS non disponibile. Vai in Impostazioni → Privacy → Localizzazione → Safari → "Mentre uso l\'app".');
  },{timeout:12000,enableHighAccuracy:true});
}

function placeUserMarker(lat,lon){
  if(userMarker) map.removeLayer(userMarker);
  userMarker=L.marker([lat,lon],{
    icon:L.divIcon({html:'<div class="user-dot"></div>',className:'',iconSize:[18,18],iconAnchor:[9,9]}),
    zIndexOffset:1000
  }).addTo(map);
}

// ── SEARCH HERE ──
function searchHere(){
  document.getElementById('searchHereBtn').classList.remove('visible');
  searchMode='area';
  const b=map.getBounds();
  const c=b.getCenter();
  // Use visible map bounds radius
  const r=kmDist(b.getNorth(),b.getWest(),b.getSouth(),b.getEast())/2;
  searchFromPoint(c.lat,c.lng,false,Math.min(r,50));
}

// ── CORE SEARCH ──
async function searchFromPoint(lat,lon,fitMap=false,overrideRadius=null){
  stationMarkers.forEach(m=>map.removeLayer(m));
  stationMarkers=[]; stations=[]; selectedIdx=null; currentStation=null;

  document.getElementById('sheetEmpty').style.display='none';
  document.getElementById('loaderEl').style.display='block';
  document.getElementById('loaderText').textContent='Ricerca distributori…';
  document.getElementById('stationList').innerHTML='';
  document.getElementById('detailPanel').classList.remove('visible');
  document.getElementById('sheetTitle').textContent='Ricerca in corso…';
  document.getElementById('sheetCount').textContent='';
  setSheet('peek');

  const radius=overrideRadius||(radiusKm*1000);
  const radiusM=overrideRadius?overrideRadius*1000:radiusKm*1000;

  try {
    const url=`https://overpass-api.de/api/interpreter?data=[out:json][timeout:25];node[amenity=fuel](around:${radiusM},${lat},${lon});out body;`;
    const res=await fetch(url);
    if(!res.ok) throw new Error('Overpass error');
    const data=await res.json();

    let nodes=(data.elements||[]).map(n=>({
      id:n.id, lat:n.lat, lon:n.lon,
      name:n.tags?.name||n.tags?.brand||'Distributore',
      brand:n.tags?.brand||'',
      address:buildAddress(n.tags),
      dist:userLat?kmDist(userLat,userLon,n.lat,n.lon):kmDist(lat,lon,n.lat,n.lon),
      payment:parsePayment(n.tags),
      attended:parseAttended(n.tags),
      tags:n.tags||{}
    })).sort((a,b)=>a.dist-b.dist);

    // Limit by radius size
    const maxN = radiusM>10000?8:radiusM>5000?12:20;
    nodes=nodes.slice(0,maxN);

    if(!nodes.length){
      document.getElementById('loaderEl').style.display='none';
      document.getElementById('sheetTitle').textContent='Nessun distributore';
      document.getElementById('sheetEmpty').style.display='block';
      document.getElementById('sheetEmpty').querySelector('.sheet-empty-title').textContent='Zona vuota';
      document.getElementById('sheetEmpty').querySelector('.sheet-empty-sub').textContent='Nessun distributore trovato.\nProva ad aumentare il raggio o sposta la mappa.';
      return;
    }

    document.getElementById('loaderText').textContent=`Analisi AI di ${nodes.length} distributori…`;
    stations=await analyzeStationsWithSearch(nodes);

    // Sort by active fuel score desc
    stations.sort((a,b)=>activeScore(b)-activeScore(a));

  } catch(e){
    console.error(e);
    document.getElementById('loaderEl').style.display='none';
    document.getElementById('sheetTitle').textContent='Errore di rete';
    document.getElementById('sheetCount').textContent='Riprova';
    return;
  }

  document.getElementById('loaderEl').style.display='none';
  renderAll(fitMap ? stations.map(s=>[s.lat,s.lon]).concat(userLat?[[userLat,userLon]]:[]) : null);
}

// ── AI ANALYSIS WITH WEB SEARCH ──
async function analyzeStationsWithSearch(nodes){
  const stationList=nodes.map((n,i)=>`${i}. "${n.name}" ${n.brand?'('+n.brand+')':''} - ${n.address||'indirizzo non noto'} - pagamento contactless: ${n.payment} - servizio: ${n.attended}`).join('\n');

  const prompt=`Sei un esperto di qualità del carburante in Italia con accesso a recensioni reali.

Hai questi distributori da valutare:
${stationList}

Per ciascuno:
1. Cerca su web recensioni recenti su Google Maps, forum auto italiani, TripAdvisor per trovare segnalazioni di problemi con benzina o diesel (acqua nel carburante, iniettori danneggiati, carburante sporco, ecc.)
2. Considera il brand: ENI/Agip/Q8/IP/Shell/Esso/TotalEnergies/API sono più affidabili dei no-brand
3. Considera che distributori legati a supermercati (Auchan, Vega, Conad, Coop) spesso hanno qualità inferiore
4. Assegna rating BENZINA e DIESEL da 0.0 a 5.0 con VARIANZA REALE - non dare lo stesso voto a tutti
5. Rating guide: 4.5-5.0=eccellente documentato, 4.0-4.4=brand noto affidabile senza problemi noti, 3.5-3.9=buono ma qualche incertezza, 3.0-3.4=nella media, 2.5-2.9=segnalazioni occasionali, 2.0-2.4=problemi noti frequenti, <2.0=evitare
6. Il diesel ha sempre rischio contaminazione leggermente maggiore: -0.2/-0.3 vs benzina
7. Se trovi recensioni negative specifiche citale nel summary

Rispondi SOLO con JSON array, zero testo aggiuntivo:
[{"idx":0,"benzina":4.1,"diesel":3.8,"summary":"Sintesi 20-30 parole con riferimento a recensioni trovate o reputazione brand","flag":"ok","payment_info":"accetta contactless"|"solo contanti"|"non verificato","found_issues":true|false}]
flag: ok|caution|avoid`;

  try {
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1200,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        messages:[{role:"user",content:prompt}]
      })
    });
    const d=await r.json();
    // Extract text from response (may include tool_use blocks)
    const textBlock=d.content?.find(b=>b.type==='text');
    const txt=textBlock?.text||'[]';
    const clean=txt.replace(/```json|```/g,'').trim();
    // Find JSON array in response
    const match=clean.match(/\[[\s\S]*\]/);
    const ratings=match?JSON.parse(match[0]):[];
    return nodes.map((n,i)=>{
      const rt=ratings.find(x=>x.idx===i);
      if(!rt) return{...n,benzina:3.2,diesel:2.9,summary:'Analisi non disponibile.',flag:'caution',payment_info:'non verificato',found_issues:false};
      return{...n,...rt};
    });
  } catch(e){
    console.error('AI error:',e);
    return nodes.map(n=>({...n,benzina:3.0,diesel:2.7,summary:'Analisi AI non disponibile.',flag:'caution',payment_info:'non verificato',found_issues:false}));
  }
}

// ── AI REVIEW (dettaglio singolo) ──
async function loadDetailReview(station){
  document.getElementById('reviewText').innerHTML='<span class="review-loading">Ricerca recensioni su web…</span>';
  document.getElementById('reviewSources').textContent='';

  const prompt=`Cerca recensioni recenti del distributore di carburante "${station.name}" situato in "${station.address||'zona '+station.lat+','+station.lon}" in Italia.

Cerca specificamente:
- Segnalazioni di problemi con benzina o diesel (acqua, sporco, iniettori danneggiati)
- Recensioni positive sulla qualità del carburante
- Commenti sul pagamento contactless/carte
- Qualità generale del servizio

Scrivi una recensione concisa (4-5 frasi) in italiano che:
1. Descriva la reputazione del distributore basandoti su quanto trovato
2. Citi eventuali problemi specifici trovati nelle recensioni
3. Dia un giudizio pratico su benzina (rating ${station.benzina}/5) e diesel (rating ${station.diesel}/5)
4. Menzioni se accetta pagamenti contactless/Apple Pay
5. Concluda con un consiglio diretto (fermarsi o evitare)

Sii specifico e basati su dati reali trovati, non generici.`;

  try {
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:400,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        messages:[{role:"user",content:prompt}]
      })
    });
    const d=await r.json();
    const textBlock=d.content?.find(b=>b.type==='text');
    const txt=textBlock?.text||'Recensione non disponibile.';
    document.getElementById('reviewText').textContent=txt;
    // Show search was done
    const searchDone=d.content?.some(b=>b.type==='tool_use'&&b.name==='web_search');
    if(searchDone) document.getElementById('reviewSources').textContent='🔍 Basato su ricerca web in tempo reale';
  } catch {
    document.getElementById('reviewText').textContent='Recensione non disponibile al momento.';
  }
}

// ── RENDER ──
function renderAll(fitBounds=null){
  stationMarkers.forEach(m=>map.removeLayer(m));
  stationMarkers=[];

  stations.forEach((s,i)=>{
    const score=activeScore(s);
    const col=pinColor(score);
    const m=L.marker([s.lat,s.lon],{
      icon:L.divIcon({
        html:`<div class="marker-pin" id="pin-${i}" style="background:${col}">${score.toFixed(1)}</div>`,
        className:'',iconSize:[40,40],iconAnchor:[20,20]
      })
    }).addTo(map);
    m.on('click',()=>selectStation(i));
    stationMarkers.push(m);
  });

  // Auto-fit map to show all markers
  if(fitBounds&&fitBounds.length>0){
    const lb=L.latLngBounds(fitBounds);
    map.fitBounds(lb,{padding:[60,60],maxZoom:15,animate:true});
  } else if(stations.length>0){
    const pts=[...stations.map(s=>[s.lat,s.lon])];
    if(userLat) pts.push([userLat,userLon]);
    map.fitBounds(L.latLngBounds(pts),{padding:[60,60],maxZoom:15,animate:true});
  }

  updateList();
  document.getElementById('sheetTitle').textContent='Distributori vicini';
  document.getElementById('sheetCount').textContent=`${stations.length} trovati`;
  setSheet('peek');
}

function updatePins(){
  stations.forEach((s,i)=>{
    const score=activeScore(s);
    const col=pinColor(score);
    const pin=document.getElementById(`pin-${i}`);
    if(pin){ pin.style.background=col; pin.textContent=score.toFixed(1); }
  });
}

function updateList(){
  const list=document.getElementById('stationList');
  list.innerHTML='';
  [...stations].sort((a,b)=>activeScore(b)-activeScore(a)).forEach((s,i)=>{
    const score=activeScore(s);
    const c=scoreColor(score);
    const pct=(score/5)*100;
    const div=document.createElement('div');
    div.className='station-item';
    div.id=`listitem-${s.id}`;
    if(currentStation&&currentStation.id===s.id) div.classList.add('selected');
    div.innerHTML=`
      <div class="si-row1">
        <div class="brand-badge">${brandLabel(s.name,s.brand)}</div>
        <div class="si-meta">
          <div class="si-name">${s.name}</div>
          <div class="si-addr">${s.address||'Indirizzo non disponibile'}</div>
        </div>
        <div class="si-right">
          <div class="si-dist">${fmtDist(s.dist)}</div>
          <div class="si-pay">${payIcon(s.payment)}</div>
        </div>
      </div>
      <div class="fuel-score-card bg-${c}">
        <div class="fsc-right" style="flex:1">
          <div class="fsc-label">${activeFuel==='benzina'?'🟢 Benzina':'🔵 Diesel'}</div>
          <div class="fsc-bar-bg"><div class="fsc-bar f-${c}" style="width:${pct}%"></div></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
          <div class="fsc-num c-${c}">${score.toFixed(1)}</div>
          <div class="fsc-verdict c-${c}">${scoreVerdict(score)}</div>
        </div>
      </div>`;
    div.onclick=()=>selectStation(stations.indexOf(s));
    list.appendChild(div);
  });
}

function selectStation(i){
  selectedIdx=i;
  currentStation=stations[i];
  const s=currentStation;

  // Highlight list
  document.querySelectorAll('.station-item').forEach(el=>el.classList.remove('selected'));
  const li=document.getElementById(`listitem-${s.id}`);
  if(li){ li.classList.add('selected'); li.scrollIntoView({behavior:'smooth',block:'nearest'}); }

  // Highlight pin
  stationMarkers.forEach((_,j)=>{
    const p=document.getElementById(`pin-${j}`);
    if(p) p.classList.toggle('selected',j===i);
  });
  map.panTo([s.lat,s.lon],{animate:true,duration:0.4});

  // Detail
  document.getElementById('detailName').textContent=s.name;
  document.getElementById('detailAddr').textContent=s.address||'Indirizzo non disponibile';

  // Score card (both fuels)
  const bc=scoreColor(s.benzina), dc=scoreColor(s.diesel);
  document.getElementById('detailScoreCard').innerHTML=`
    <div style="display:flex;gap:8px;">
      <div class="dscore bg-${bc}" style="flex:1;">
        <div class="dscore-label">🟢 Benzina</div>
        <div class="dscore-row">
          <div class="dscore-num c-${bc}">${s.benzina.toFixed(1)}</div>
          <div class="dscore-right">
            <div class="dscore-bar-bg"><div class="dscore-bar f-${bc}" style="width:${s.benzina/5*100}%"></div></div>
            <div class="dscore-verdict c-${bc}">${scoreVerdict(s.benzina)}</div>
          </div>
        </div>
      </div>
      <div class="dscore bg-${dc}" style="flex:1;">
        <div class="dscore-label">🔵 Diesel</div>
        <div class="dscore-row">
          <div class="dscore-num c-${dc}">${s.diesel.toFixed(1)}</div>
          <div class="dscore-right">
            <div class="dscore-bar-bg"><div class="dscore-bar f-${dc}" style="width:${s.diesel/5*100}%"></div></div>
            <div class="dscore-verdict c-${dc}">${scoreVerdict(s.diesel)}</div>
          </div>
        </div>
      </div>
    </div>`;

  // Tags
  const tags=[];
  if(s.payment==='yes') tags.push(`<span class="tag tag-pay-yes">💳 Contactless/Apple Pay</span>`);
  else if(s.payment==='no') tags.push(`<span class="tag tag-pay-no">💵 Solo contanti</span>`);
  else tags.push(`<span class="tag tag-pay-unk">❓ Pagamento da verificare</span>`);
  if(s.attended==='self') tags.push(`<span class="tag tag-self">🤖 Self service</span>`);
  else if(s.attended==='attended') tags.push(`<span class="tag tag-att">👤 Con operatore</span>`);
  if(isWhite(s.name,s.brand)) tags.push(`<span class="tag tag-white">⚪ No-brand</span>`);
  if(s.found_issues) tags.push(`<span class="tag" style="background:rgba(255,59,48,.1);color:var(--red);">⚠️ Problemi segnalati</span>`);
  document.getElementById('detailTags').innerHTML=tags.join('');

  // Reset copy btn
  const cb=document.getElementById('copyBtn');
  cb.className='copy-btn'; cb.textContent='📋 Copia indirizzo';

  document.getElementById('detailPanel').classList.add('visible');
  setSheet('expanded');

  // Load review async
  loadDetailReview(s);
}

function deselectAll(){
  selectedIdx=null; currentStation=null;
  document.querySelectorAll('.station-item').forEach(el=>el.classList.remove('selected'));
  stationMarkers.forEach((_,j)=>{ const p=document.getElementById(`pin-${j}`); if(p) p.classList.remove('selected'); });
  document.getElementById('detailPanel').classList.remove('visible');
}

// ── NAVIGATION — use location.href to avoid blank screen on back ──
function doNav(type){
  if(!currentStation) return;
  const s=currentStation;
  const coord=`${s.lat},${s.lon}`;
  let url='';
  if(type==='apple') url=`maps://?daddr=${coord}&dirflg=d`;
  else if(type==='google') url=`comgooglemaps://?daddr=${coord}&directionsmode=driving`;
  else if(type==='waze') url=`waze://?ll=${coord}&navigate=yes`;

  // Try native app first, fallback to web
  const fallbacks={
    apple:`https://maps.apple.com/?daddr=${coord}&dirflg=d`,
    google:`https://www.google.com/maps/dir/?api=1&destination=${coord}`,
    waze:`https://waze.com/ul?ll=${coord}&navigate=yes`
  };

  // Use hidden iframe trick to launch app without navigating away
  const iframe=document.createElement('iframe');
  iframe.style.display='none';
  document.body.appendChild(iframe);
  iframe.src=url;
  setTimeout(()=>{ document.body.removeChild(iframe); },500);

  // Fallback: open web version in new tab after short delay
  setTimeout(()=>{ window.open(fallbacks[type],'_blank'); },300);
}

// ── COPY ADDRESS ──
function copyAddress(){
  if(!currentStation) return;
  const addr=currentStation.address||(currentStation.lat+', '+currentStation.lon);
  const btn=document.getElementById('copyBtn');
  if(navigator.clipboard){
    navigator.clipboard.writeText(addr).then(()=>{
      btn.className='copy-btn copied'; btn.textContent='✓ Copiato!';
      setTimeout(()=>{ btn.className='copy-btn'; btn.textContent='📋 Copia indirizzo'; },2000);
    });
  } else {
    const ta=document.createElement('textarea');
    ta.value=addr; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.className='copy-btn copied'; btn.textContent='✓ Copiato!';
    setTimeout(()=>{ btn.className='copy-btn'; btn.textContent='📋 Copia indirizzo'; },2000);
  }
}
