<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Benzina Radar"/>
  <meta name="theme-color" content="#f2f2f7"/>
  <title>Benzina Radar</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;}
    :root{
      --bg:#f2f2f7;--bg2:#fff;--bg3:#e5e5ea;
      --label:#000;--label2:#3c3c43;--label3:rgba(60,60,67,.6);--label4:rgba(60,60,67,.18);
      --sep:rgba(60,60,67,.22);
      --blue:#007aff;--green:#34c759;--yellow:#ff9f0a;--orange:#ff6b00;--red:#ff3b30;--lime:#30d158;--purple:#af52de;
      --safe-top:env(safe-area-inset-top,44px);--safe-bottom:env(safe-area-inset-bottom,20px);
    }
    html,body{height:100%;overflow:hidden;background:var(--bg);}
    #app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;position:relative;}

    .nav{background:rgba(242,242,247,.95);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:calc(var(--safe-top) + 6px) 14px 10px;flex-shrink:0;border-bottom:.5px solid var(--sep);z-index:200;}
    .nav-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .logo{font-size:17px;font-weight:700;letter-spacing:-.5px;}
    .controls{display:flex;align-items:center;gap:7px;}
    .seg{display:flex;background:var(--bg3);border-radius:8px;padding:2px;}
    .seg-btn{padding:5px 10px;border-radius:6px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--label3);transition:all .2s;white-space:nowrap;}
    .seg-btn.on{background:var(--bg2);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12);}
    .ibt{width:34px;height:34px;border-radius:17px;border:none;background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:opacity .15s;}
    .ibt:active{opacity:.6;}
    .ibt.blue{background:var(--blue);}
    .radius-row{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none;}
    .radius-row::-webkit-scrollbar{display:none;}
    .rl{font-size:12px;color:var(--label3);font-weight:500;white-space:nowrap;flex-shrink:0;}
    .pill{padding:4px 10px;border-radius:14px;font-size:13px;font-weight:500;background:var(--bg3);color:var(--label2);border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;}
    .pill.on{background:var(--blue);color:#fff;}

    .map-wrap{position:relative;flex:1;min-height:0;}
    #map{width:100%;height:100%;}
    .leaflet-control-attribution{font-size:9px!important;}
    .leaflet-control-zoom{display:none;}

    .area-btn{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:400;background:var(--bg2);color:var(--blue);border:none;border-radius:20px;padding:8px 18px;font-size:14px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.18);cursor:pointer;display:none;white-space:nowrap;}
    .area-btn.show{display:block;}
    .area-btn:active{opacity:.7;}

    .fabs{position:absolute;right:14px;bottom:20px;z-index:400;display:flex;flex-direction:column;gap:10px;}
    .fab{width:46px;height:46px;border-radius:23px;border:none;background:var(--bg2);box-shadow:0 2px 14px rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .15s;}
    .fab:active{transform:scale(.92);}
    .fab.list-open{width:auto;padding:0 16px;font-size:14px;font-weight:600;color:var(--blue);gap:5px;display:none;}
    .fab.list-open.vis{display:flex;}

    .sheet{position:absolute;bottom:0;left:0;right:0;background:var(--bg2);border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--sep),0 -6px 24px rgba(0,0,0,.09);z-index:300;display:flex;flex-direction:column;transition:transform .38s cubic-bezier(.32,.72,0,1);max-height:90dvh;}
    .sheet.s-hidden{transform:translateY(100%);}
    .sheet.s-peek{transform:translateY(calc(100% - 210px));}
    .sheet.s-half{transform:translateY(40dvh);}
    .sheet.s-full{transform:translateY(0);}

    .sh-handle{padding:8px 0 5px;display:flex;justify-content:center;cursor:pointer;flex-shrink:0;}
    .sh-bar{width:36px;height:4px;border-radius:2px;background:var(--label4);}
    .sh-head{padding:0 16px 10px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
    .sh-title{font-size:17px;font-weight:700;letter-spacing:-.4px;}
    .sh-sub{font-size:13px;color:var(--label3);}

    .detail{padding:0 16px 14px;border-bottom:.5px solid var(--sep);display:none;overflow-y:auto;max-height:60dvh;-webkit-overflow-scrolling:touch;flex-shrink:0;}
    .detail.open{display:block;}
    .d-toprow{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px;}
    .d-name{font-size:18px;font-weight:700;letter-spacing:-.5px;flex:1;line-height:1.2;}
    .fav-btn{background:none;border:none;font-size:24px;cursor:pointer;padding:0 0 0 8px;flex-shrink:0;}
    .d-addr{font-size:13px;color:var(--label3);margin-bottom:12px;display:flex;align-items:center;gap:4px;}

    .score-row{display:flex;gap:8px;margin-bottom:10px;}
    .scard{flex:1;border-radius:11px;padding:10px 12px;}
    .scard-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--label3);margin-bottom:5px;}
    .scard-main{display:flex;align-items:center;gap:8px;}
    .scard-num{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1;}
    .scard-bar-bg{height:3px;background:rgba(0,0,0,.08);border-radius:2px;overflow:hidden;margin-bottom:3px;}
    .scard-bar{height:100%;border-radius:2px;}
    .scard-verdict{font-size:10px;font-weight:700;}
    .scard-right{flex:1;}

    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
    .chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
    .chip-py{background:rgba(175,82,222,.12);color:var(--purple);}
    .chip-pn{background:rgba(60,60,67,.1);color:var(--label3);}
    .chip-pu{background:rgba(60,60,67,.07);color:var(--label3);}
    .chip-sf{background:rgba(0,122,255,.1);color:var(--blue);}
    .chip-at{background:rgba(52,199,89,.1);color:var(--green);}
    .chip-wb{background:rgba(255,159,10,.1);color:var(--yellow);}
    .chip-wn{background:rgba(255,59,48,.1);color:var(--red);}

    .rbox{background:var(--bg);border-radius:11px;padding:12px;margin-bottom:12px;}
    .rbox-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--label3);margin-bottom:7px;}
    .rbox-body{font-size:13px;color:var(--label2);line-height:1.65;}
    .rbox-body.loading{color:var(--label3);font-style:italic;}
    .rbox-src{font-size:11px;color:var(--label3);margin-top:5px;}

    .nav-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--label3);margin-bottom:7px;}
    .nav-btns{display:flex;gap:7px;margin-bottom:8px;}
    .nav-btn{flex:1;padding:11px 4px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:opacity .15s;}
    .nav-btn:active{opacity:.7;}
    .nb-a{background:var(--blue);color:#fff;}
    .nb-g{background:#34a853;color:#fff;}
    .nb-w{background:#33ccff;color:#000;}

    .cpbtn{width:100%;padding:11px;border-radius:10px;border:none;background:var(--bg3);color:var(--label2);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:9px;transition:all .15s;}
    .cpbtn:active{opacity:.7;}
    .cpbtn.done{background:rgba(52,199,89,.15);color:var(--green);}
    .logbtn{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--blue);background:rgba(0,122,255,.07);color:var(--blue);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s;}
    .logbtn:active{opacity:.7;}

    .tabs{display:flex;border-bottom:.5px solid var(--sep);flex-shrink:0;}
    .tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;color:var(--label3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
    .tab.on{color:var(--blue);border-bottom-color:var(--blue);}

    .scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom)+10px);}
    .si{padding:12px 16px;border-bottom:.5px solid var(--sep);cursor:pointer;background:var(--bg2);transition:background .1s;display:flex;align-items:center;gap:10px;}
    .si:active{background:var(--bg3);}
    .si.sel{background:rgba(0,122,255,.06);}
    .si-badge{width:38px;height:38px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--label2);flex-shrink:0;}
    .si-mid{flex:1;min-width:0;}
    .si-name{font-size:15px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .si-addr{font-size:11px;color:var(--label3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
    .si-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
    .si-dist{font-size:11px;color:var(--label3);font-weight:500;}
    .si-score{font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1;}
    .si-verd{font-size:10px;font-weight:700;}

    .empty{padding:44px 20px;text-align:center;}
    .empty-ico{font-size:46px;margin-bottom:12px;}
    .empty-t{font-size:16px;font-weight:600;margin-bottom:6px;}
    .empty-s{font-size:13px;color:var(--label3);line-height:1.6;}
    .loader{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px;color:var(--label3);font-size:14px;}
    .spin{width:18px;height:18px;border:2px solid var(--bg3);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0;}
    @keyframes sp{to{transform:rotate(360deg);}}

    .prof{padding:16px;}
    .prof-sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--label3);margin-bottom:10px;}
    .prof-item{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;}
    .prof-item:active{opacity:.7;}
    .pi-info{flex:1;min-width:0;}
    .pi-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .pi-meta{font-size:12px;color:var(--label3);margin-top:2px;}
    .delbtn{background:none;border:none;font-size:16px;cursor:pointer;color:var(--label3);padding:4px;flex-shrink:0;}

    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:flex-end;}
    .modal-bg.open{display:flex;}
    .modal{background:var(--bg2);border-radius:16px 16px 0 0;padding:20px 20px calc(var(--safe-bottom)+20px);width:100%;position:relative;}
    .modal-title{font-size:17px;font-weight:700;letter-spacing:-.4px;margin-bottom:4px;text-align:center;}
    .modal-sub{font-size:13px;color:var(--label3);text-align:center;margin-bottom:18px;}
    .modal-x{position:absolute;top:18px;right:18px;background:var(--bg3);border:none;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--label3);}
    .flbl{font-size:13px;font-weight:600;color:var(--label2);margin-bottom:6px;display:block;}
    .fgrp{margin-bottom:14px;}
    .finput{width:100%;padding:11px 14px;border-radius:10px;border:.5px solid var(--sep);background:var(--bg);font-size:15px;color:var(--label);outline:none;-webkit-appearance:none;}
    .finput:focus{border-color:var(--blue);}
    textarea.finput{resize:none;height:76px;font-family:inherit;}
    .star-row{display:flex;gap:8px;}
    .star{font-size:30px;cursor:pointer;opacity:.25;transition:opacity .15s;}
    .star.on{opacity:1;}
    .sub-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px;transition:opacity .15s;}
    .sub-btn:active{opacity:.8;}

    .mpin{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);border:2.5px solid #fff;cursor:pointer;transition:transform .2s,box-shadow .2s;}
    .mpin.sel{transform:scale(1.3);box-shadow:0 4px 16px rgba(0,0,0,.35);}
    .udot{width:16px;height:16px;border-radius:50%;background:var(--blue);border:2.5px solid #fff;box-shadow:0 0 0 4px rgba(0,122,255,.22);}

    .cr{color:var(--red)}.fr{background:var(--red)}.bgr{background:rgba(255,59,48,.1)}
    .co{color:var(--orange)}.fo{background:var(--orange)}.bgo{background:rgba(255,107,0,.1)}
    .cy{color:var(--yellow)}.fy{background:var(--yellow)}.bgy{background:rgba(255,159,10,.1)}
    .cl{color:var(--lime)}.fl{background:var(--lime)}.bgl{background:rgba(48,209,88,.1)}
    .cg{color:var(--green)}.fg{background:var(--green)}.bgg{background:rgba(52,199,89,.1)}

    .toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;z-index:9999;pointer-events:none;animation:tin .3s ease;}
    @keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

    @media(min-width:768px){
      .sheet{width:380px;left:auto;right:0;border-radius:0;max-height:100%;height:100%;top:0;bottom:auto;box-shadow:-2px 0 20px rgba(0,0,0,.1);}
      .sheet.s-hidden{transform:translateX(100%);}
      .sheet.s-peek,.sheet.s-half,.sheet.s-full{transform:translateX(0);}
      .sh-handle,.sh-bar{display:none;}
      .fabs{right:396px;}
      .area-btn{left:calc(50% - 190px);}
      .detail{max-height:none;}
    }
  </style>
</head>
<body>
<div id="app">
  <div class="nav">
    <div class="nav-top">
      <div class="logo">⛽ Benzina Radar</div>
      <div class="controls">
        <div class="seg">
          <button class="seg-btn on" onclick="setFuel('benzina',this)">Benzina</button>
          <button class="seg-btn" onclick="setFuel('diesel',this)">Diesel</button>
        </div>
        <button class="ibt blue" onclick="locateMe()" id="btnLoc">📍</button>
        <button class="ibt" onclick="openProfile()">👤</button>
      </div>
    </div>
    <div class="radius-row">
      <span class="rl">Raggio</span>
      <button class="pill" onclick="setR(1,this)">1 km</button>
      <button class="pill" onclick="setR(2,this)">2 km</button>
      <button class="pill on" onclick="setR(5,this)">5 km</button>
      <button class="pill" onclick="setR(10,this)">10 km</button>
      <button class="pill" onclick="setR(20,this)">20 km</button>
    </div>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <button class="area-btn" id="areaBtn" onclick="searchHere()">🔍 Cerca in quest'area</button>
    <div class="fabs">
      <button class="fab" onclick="locateMe()">📍</button>
      <button class="fab list-open" id="listFab" onclick="openSheet()">📋 Lista</button>
    </div>
  </div>

  <div class="sheet s-hidden" id="sheet">
    <div class="sh-handle" onclick="cycleSheet()"><div class="sh-bar"></div></div>
    <div class="sh-head" onclick="cycleSheet()">
      <div class="sh-title" id="shTitle">Distributori</div>
      <div class="sh-sub" id="shSub"></div>
    </div>

    <div class="detail" id="detail">
      <div class="d-toprow">
        <div class="d-name" id="dName"></div>
        <button class="fav-btn" id="favBtn" onclick="toggleFav()">🤍</button>
      </div>
      <div class="d-addr">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <span id="dAddr"></span>
      </div>
      <div class="score-row" id="dScores"></div>
      <div class="chips" id="dChips"></div>
      <div class="rbox">
        <div class="rbox-t">📊 Analisi AI</div>
        <div class="rbox-body loading" id="rText">Ricerca recensioni in corso…</div>
        <div class="rbox-src" id="rSrc"></div>
      </div>
      <div class="nav-lbl">Naviga con</div>
      <div class="nav-btns">
        <button class="nav-btn nb-a" onclick="doNav('apple')">🗺 Apple</button>
        <button class="nav-btn nb-g" onclick="doNav('google')">🌍 Google</button>
        <button class="nav-btn nb-w" onclick="doNav('waze')">🚗 Waze</button>
      </div>
      <button class="cpbtn" id="cpBtn" onclick="copyAddr()">📋 Copia indirizzo</button>
      <button class="logbtn" onclick="openLog()">📝 Registra rifornimento</button>
    </div>

    <div class="tabs" id="tabs" style="display:none;">
      <div class="tab on" onclick="goTab('list',this)">Lista</div>
      <div class="tab" onclick="goTab('profile',this)">Profilo</div>
    </div>

    <div class="scroll">
      <div class="empty" id="emptyState">
        <div class="empty-ico">🗺️</div>
        <div class="empty-t">Inizia la ricerca</div>
        <div class="empty-s">Premi 📍 per trovare<br>distributori vicino a te</div>
      </div>
      <div class="loader" id="loaderEl" style="display:none;">
        <div class="spin"></div><span id="loaderTxt">Analisi in corso…</span>
      </div>
      <div id="stList"></div>
      <div id="profTab" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="logModal">
  <div class="modal">
    <button class="modal-x" onclick="closeLog()">✕</button>
    <div class="modal-title">Rifornimento</div>
    <div class="modal-sub" id="logSub"></div>
    <div class="fgrp">
      <label class="flbl">Carburante</label>
      <div class="seg" style="width:100%;">
        <button class="seg-btn on" id="lsB" onclick="setLF('benzina',this)" style="flex:1;padding:8px;">Benzina</button>
        <button class="seg-btn" id="lsD" onclick="setLF('diesel',this)" style="flex:1;padding:8px;">Diesel</button>
      </div>
    </div>
    <div class="fgrp">
      <label class="flbl">Valutazione</label>
      <div class="star-row">
        <span class="star" data-v="1" onclick="setStar(1)">⭐</span>
        <span class="star" data-v="2" onclick="setStar(2)">⭐</span>
        <span class="star" data-v="3" onclick="setStar(3)">⭐</span>
        <span class="star" data-v="4" onclick="setStar(4)">⭐</span>
        <span class="star" data-v="5" onclick="setStar(5)">⭐</span>
      </div>
    </div>
    <div class="fgrp">
      <label class="flbl">Note</label>
      <textarea class="finput" id="logNotes" placeholder="Es: ottima qualità, nessun problema…"></textarea>
    </div>
    <button class="sub-btn" onclick="saveLog()">Salva</button>
  </div>
</div>

<script>
const S={get:k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let favs=S.get('favs')||{},logs=S.get('logs')||[];
let map,uMarker,cluster,stations=[],sel=null;
let uLat=null,uLon=null,radius=5,fuel='benzina';
let shPos='s-hidden',activeTab='list';
let logFuel='benzina',logStars=0,logStation=null;

// Netlify function endpoint
const API='/.netlify/functions/analyze';

const isMob=()=>/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||window.innerWidth<768;

map=L.map('map',{zoomControl:false}).setView([45.48,12.23],12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);

cluster=L.markerClusterGroup({maxClusterRadius:50,iconCreateFunction:c=>{const n=c.getChildCount();return L.divIcon({html:`<div style="background:var(--blue);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);">${n}</div>`,className:'',iconSize:[38,38],iconAnchor:[19,19]});}}).addTo(map);

map.on('movestart',()=>{if(stations.length>0)document.getElementById('areaBtn').classList.add('show');});
map.on('click',e=>{if(e.originalEvent.target.classList.contains('mpin'))return;deselect();if(isMob()&&shPos==='s-full')setSheet('s-peek');});
window.addEventListener('load',()=>{if(navigator.geolocation)locateMe();});
window.addEventListener('resize',()=>{if(!isMob()&&stations.length>0)setSheet('s-full');});

function setSheet(p){shPos=p;document.getElementById('sheet').className=`sheet ${p}`;document.getElementById('listFab').classList.toggle('vis',p==='s-hidden'&&stations.length>0);}
function openSheet(){setSheet('s-peek');}
function cycleSheet(){if(shPos==='s-peek')setSheet('s-half');else if(shPos==='s-half')setSheet('s-full');else setSheet('s-peek');}
function goTab(t,btn){activeTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.getElementById('stList').style.display=t==='list'?'block':'none';document.getElementById('profTab').style.display=t==='profile'?'block':'none';if(t==='profile')renderProfile();}
function setFuel(f,btn){fuel=f;document.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');if(stations.length>0){updatePins();renderList();}}
function setR(km,btn){radius=km;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));btn.classList.add('on');}

function kd(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function fd(km){return km<1?`${Math.round(km*1000)}m`:`${km.toFixed(1)}km`;}
function sc(s){if(s>=4.5)return'g';if(s>=3.5)return'l';if(s>=2.5)return'y';if(s>=1.5)return'o';return'r';}
function sv(s){if(s>=4.5)return'Ottimo';if(s>=3.5)return'Buono';if(s>=2.5)return'Discreto';if(s>=1.5)return'Dubbioso';return'Evita';}
function aS(s){return fuel==='benzina'?s.benzina:s.diesel;}
function pc(s){if(s>=4.5)return'#34c759';if(s>=3.5)return'#30d158';if(s>=2.5)return'#ff9f0a';if(s>=1.5)return'#ff6b00';return'#ff3b30';}
function bl(n,b){const s=(n+b).toLowerCase();if(s.includes('eni')||s.includes('agip'))return'ENI';if(s.includes('q8')||s.includes('kuwait'))return'Q8';if(s.includes('total'))return'TTE';if(s.includes('shell'))return'SHL';if(s.includes('tamoil'))return'TAM';if(s.includes('esso')||s.includes('exxon'))return'ESO';if(s.includes('api'))return'API';if(s.includes('italiana petrol'))return'IP';return'⛽';}
function isWh(n,b){return!['eni','agip','q8','kuwait','total','shell','tamoil','esso','exxon','italiana petrol','api'].some(k=>(n+b).toLowerCase().includes(k));}
function pp(t){if(!t)return'u';if(['payment:contactless','payment:nfc','payment:apple_pay','payment:credit_cards'].some(k=>t[k]==='yes'))return'y';if(t['payment:contactless']==='no'||t['payment:cash_only']==='yes')return'n';return'u';}
function pa(t){if(!t)return'u';if(t['attended']==='yes')return'a';if(t['self_service']==='yes')return's';return'u';}
function ba(t){if(!t)return'';const p=[];if(t['addr:street'])p.push(t['addr:street']);if(t['addr:housenumber'])p.push(t['addr:housenumber']);if(t['addr:city'])p.push(t['addr:city']);return p.join(', ');}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>{try{document.body.removeChild(el);}catch{}},300);},2200);}

function locateMe(){
  const btn=document.getElementById('btnLoc');
  btn.style.opacity='.4';
  navigator.geolocation.getCurrentPosition(pos=>{
    uLat=pos.coords.latitude;uLon=pos.coords.longitude;
    placeUDot(uLat,uLon);
    btn.style.opacity='1';
    searchFrom(uLat,uLon);
  },()=>{
    btn.style.opacity='1';
    const isMac=/Mac/.test(navigator.platform)&&!/iPhone|iPad/.test(navigator.userAgent);
    alert(isMac?'Mac: Safari → Impostazioni → Siti web → Posizione → Consenti.':'iPhone: Impostazioni → Privacy → Localizzazione → Safari → "Mentre uso l\'app".');
  },{timeout:12000,enableHighAccuracy:true});
}

function placeUDot(lat,lon){if(uMarker)map.removeLayer(uMarker);uMarker=L.marker([lat,lon],{icon:L.divIcon({html:'<div class="udot"></div>',className:'',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:2000}).addTo(map);}

function searchHere(){document.getElementById('areaBtn').classList.remove('show');const b=map.getBounds(),c=b.getCenter();const r=Math.max(1,Math.min(kd(b.getNorth(),b.getWest(),b.getSouth(),b.getEast())/2,30));searchFrom(c.lat,c.lng,false,r);}

async function searchFrom(lat,lon,fit=true,ovKm=null){
  cluster.clearLayers();stations=[];sel=null;
  document.getElementById('detail').classList.remove('open');
  document.getElementById('tabs').style.display='none';
  document.getElementById('emptyState').style.display='none';
  document.getElementById('loaderEl').style.display='flex';
  document.getElementById('stList').innerHTML='';
  document.getElementById('loaderTxt').textContent='Ricerca distributori…';
  document.getElementById('shTitle').textContent='Ricerca…';
  document.getElementById('shSub').textContent='';
  setSheet(isMob()?'s-peek':'s-full');

  const km=ovKm||radius;
  const maxN=km>10?8:km>5?12:20;

  try{
    const url=`https://overpass-api.de/api/interpreter?data=[out:json][timeout:25];node[amenity=fuel](around:${km*1000},${lat},${lon});out body;`;
    const data=await(await fetch(url)).json();
    let nodes=(data.elements||[]).map(n=>({
      id:n.id,lat:n.lat,lon:n.lon,
      name:n.tags?.name||n.tags?.brand||'Distributore',
      brand:n.tags?.brand||'',
      address:ba(n.tags),
      dist:uLat?kd(uLat,uLon,n.lat,n.lon):kd(lat,lon,n.lat,n.lon),
      payment:pp(n.tags),attended:pa(n.tags),tags:n.tags||{}
    })).sort((a,b)=>a.dist-b.dist).slice(0,maxN);

    if(!nodes.length){
      document.getElementById('loaderEl').style.display='none';
      document.getElementById('emptyState').style.display='block';
      document.getElementById('emptyState').querySelector('.empty-t').textContent='Nessun distributore';
      document.getElementById('emptyState').querySelector('.empty-s').textContent='Prova ad aumentare il raggio o sposta la mappa.';
      document.getElementById('shTitle').textContent='Nessun risultato';
      return;
    }

    document.getElementById('loaderTxt').textContent=`Analisi AI di ${nodes.length} distributori…`;

    // Call Netlify backend
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stations:nodes,mode:'batch'})});
    const json=await res.json();
    const ratings=json.ratings||[];

    stations=nodes.map((n,i)=>{
      const rt=ratings.find(x=>x.idx===i);
      return rt?{...n,...rt}:{...n,benzina:3.0,diesel:2.7,summary:'Analisi non disponibile.',flag:'caution',payment_info:'non verificato',found_issues:false};
    }).sort((a,b)=>aS(b)-aS(a));

  }catch(e){
    console.error(e);
    document.getElementById('loaderEl').style.display='none';
    document.getElementById('shTitle').textContent='Errore';
    document.getElementById('shSub').textContent='Controlla la connessione';
    return;
  }

  document.getElementById('loaderEl').style.display='none';
  document.getElementById('tabs').style.display='flex';
  renderAll(fit);
}

function renderAll(fit=true){
  cluster.clearLayers();
  stations.forEach((s,i)=>{
    const score=aS(s),col=pc(score);
    const m=L.marker([s.lat,s.lon],{icon:L.divIcon({html:`<div class="mpin" id="pin-${i}" style="background:${col}">${score.toFixed(1)}</div>`,className:'',iconSize:[40,40],iconAnchor:[20,20]})});
    m.on('click',()=>selStation(i));
    cluster.addLayer(m);
  });
  if(fit&&stations.length>0){const pts=stations.map(s=>[s.lat,s.lon]);if(uLat)pts.push([uLat,uLon]);map.fitBounds(L.latLngBounds(pts),{padding:[60,60],maxZoom:15,animate:true});}
  renderList();
  document.getElementById('shTitle').textContent='Distributori vicini';
  document.getElementById('shSub').textContent=`${stations.length} trovati`;
  document.getElementById('listFab').classList.remove('vis');
}

function renderList(){
  const el=document.getElementById('stList');el.innerHTML='';
  [...stations].sort((a,b)=>aS(b)-aS(a)).forEach((s,i)=>{
    const score=aS(s),c=sc(score),isFav=!!favs[s.id];
    const div=document.createElement('div');
    div.className='si'+(sel?.id===s.id?' sel':'');div.id=`li-${s.id}`;
    div.innerHTML=`<div class="si-badge">${bl(s.name,s.brand)}</div><div class="si-mid"><div class="si-name">${isFav?'❤️ ':''}${s.name}</div><div class="si-addr">${s.address||'Indirizzo non disponibile'}</div></div><div class="si-right"><div class="si-dist">${fd(s.dist)}</div><div class="si-score c${c}">${score.toFixed(1)}</div><div class="si-verd c${c}">${sv(score)}</div></div>`;
    div.onclick=()=>selStation(stations.indexOf(s));
    el.appendChild(div);
  });
}

function updatePins(){stations.forEach((s,i)=>{const score=aS(s),p=document.getElementById(`pin-${i}`);if(p){p.style.background=pc(score);p.textContent=score.toFixed(1);}});}

function selStation(i){
  sel=stations[i];const s=sel;
  document.querySelectorAll('.si').forEach(e=>e.classList.remove('sel'));
  const li=document.getElementById(`li-${s.id}`);
  if(li){li.classList.add('sel');li.scrollIntoView({behavior:'smooth',block:'nearest'});}
  stations.forEach((_,j)=>{const p=document.getElementById(`pin-${j}`);if(p)p.classList.toggle('sel',j===i);});
  map.panTo([s.lat,s.lon],{animate:true,duration:.4});

  document.getElementById('dName').textContent=s.name;
  document.getElementById('dAddr').textContent=s.address||'Indirizzo non disponibile';
  document.getElementById('favBtn').textContent=favs[s.id]?'❤️':'🤍';

  const bc=sc(s.benzina),dc=sc(s.diesel);
  document.getElementById('dScores').innerHTML=`<div class="scard bg${bc}"><div class="scard-lbl">🟢 Benzina</div><div class="scard-main"><div class="scard-num c${bc}">${s.benzina.toFixed(1)}</div><div class="scard-right"><div class="scard-bar-bg"><div class="scard-bar f${bc}" style="width:${s.benzina/5*100}%"></div></div><div class="scard-verdict c${bc}">${sv(s.benzina)}</div></div></div></div><div class="scard bg${dc}"><div class="scard-lbl">🔵 Diesel</div><div class="scard-main"><div class="scard-num c${dc}">${s.diesel.toFixed(1)}</div><div class="scard-right"><div class="scard-bar-bg"><div class="scard-bar f${dc}" style="width:${s.diesel/5*100}%"></div></div><div class="scard-verdict c${dc}">${sv(s.diesel)}</div></div></div></div>`;

  const chips=[];
  if(s.payment==='y')chips.push(`<span class="chip chip-py">💳 Apple Pay / Contactless</span>`);
  else if(s.payment==='n')chips.push(`<span class="chip chip-pn">💵 Solo contanti</span>`);
  else chips.push(`<span class="chip chip-pu">❓ Pagamento da verificare</span>`);
  if(s.attended==='s')chips.push(`<span class="chip chip-sf">🤖 Self service</span>`);
  else if(s.attended==='a')chips.push(`<span class="chip chip-at">👤 Con operatore</span>`);
  if(isWh(s.name,s.brand))chips.push(`<span class="chip chip-wb">⚪ No-brand</span>`);
  if(s.found_issues)chips.push(`<span class="chip chip-wn">⚠️ Problemi segnalati</span>`);
  document.getElementById('dChips').innerHTML=chips.join('');

  document.getElementById('cpBtn').className='cpbtn';document.getElementById('cpBtn').textContent='📋 Copia indirizzo';
  document.getElementById('rText').className='rbox-body loading';document.getElementById('rText').textContent='Ricerca recensioni in corso…';document.getElementById('rSrc').textContent='';
  document.getElementById('detail').classList.add('open');
  setSheet('s-full');
  loadReview(s);
}

function deselect(){sel=null;document.querySelectorAll('.si').forEach(e=>e.classList.remove('sel'));stations.forEach((_,i)=>{const p=document.getElementById(`pin-${i}`);if(p)p.classList.remove('sel');});document.getElementById('detail').classList.remove('open');}

async function loadReview(s){
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stations:[s],mode:'review'})});
    const json=await res.json();
    const el=document.getElementById('rText');
    el.className='rbox-body';el.textContent=json.review||'Recensione non disponibile.';
    if(json.searched)document.getElementById('rSrc').textContent='🔍 Basato su ricerca web in tempo reale';
  }catch(e){document.getElementById('rText').className='rbox-body';document.getElementById('rText').textContent='Recensione non disponibile.';}
}

function toggleFav(){if(!sel)return;if(favs[sel.id])delete favs[sel.id];else favs[sel.id]={id:sel.id,name:sel.name,address:sel.address,lat:sel.lat,lon:sel.lon};S.set('favs',favs);document.getElementById('favBtn').textContent=favs[sel.id]?'❤️':'🤍';renderList();}

function doNav(type){if(!sel)return;const coord=`${sel.lat},${sel.lon}`;const urls={apple:`https://maps.apple.com/?daddr=${coord}&dirflg=d`,google:`https://www.google.com/maps/dir/?api=1&destination=${coord}`,waze:`https://waze.com/ul?ll=${coord}&navigate=yes`};window.open(urls[type],'_blank');}

function copyAddr(){if(!sel)return;const addr=sel.address||`${sel.lat}, ${sel.lon}`;const btn=document.getElementById('cpBtn');const done=()=>{btn.className='cpbtn done';btn.textContent='✓ Copiato!';setTimeout(()=>{btn.className='cpbtn';btn.textContent='📋 Copia indirizzo';},2000);};if(navigator.clipboard)navigator.clipboard.writeText(addr).then(done).catch(()=>fbCopy(addr,done));else fbCopy(addr,done);}
function fbCopy(txt,cb){const t=document.createElement('textarea');t.value=txt;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();try{document.execCommand('copy');cb();}catch{}document.body.removeChild(t);}

function openLog(){if(!sel)return;logStation=sel;logFuel=fuel;logStars=0;document.getElementById('logSub').textContent=sel.name;document.getElementById('logNotes').value='';document.getElementById('lsB').classList.toggle('on',logFuel==='benzina');document.getElementById('lsD').classList.toggle('on',logFuel==='diesel');setStar(0);document.getElementById('logModal').classList.add('open');}
function closeLog(){document.getElementById('logModal').classList.remove('open');}
function setLF(f,btn){logFuel=f;document.querySelectorAll('#logModal .seg-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function setStar(v){logStars=v;document.querySelectorAll('.star').forEach(s=>s.classList.toggle('on',parseInt(s.dataset.v)<=v));}
function saveLog(){if(!logStation||!logStars){toast('⭐ Seleziona almeno una stella');return;}const entry={id:Date.now(),stationId:logStation.id,stationName:logStation.name,stationAddr:logStation.address,lat:logStation.lat,lon:logStation.lon,fuel:logFuel,stars:logStars,notes:document.getElementById('logNotes').value.trim(),date:new Date().toLocaleDateString('it-IT')};logs.unshift(entry);if(logs.length>200)logs=logs.slice(0,200);S.set('logs',logs);closeLog();renderList();toast('✓ Rifornimento salvato');}

function openProfile(){document.getElementById('tabs').style.display='flex';document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',i===1));activeTab='profile';document.getElementById('stList').style.display='none';document.getElementById('profTab').style.display='block';renderProfile();setSheet('s-full');}

function renderProfile(){
  const el=document.getElementById('profTab');let h='<div class="prof">';
  const favArr=Object.values(favs);
  h+=`<div class="prof-sec">❤️ Preferiti (${favArr.length})</div>`;
  if(!favArr.length){h+='<div style="color:var(--label3);font-size:13px;margin-bottom:16px;">Nessun preferito. Premi 🤍 su un distributore.</div>';}
  else{favArr.forEach(f=>{h+=`<div class="prof-item" onclick="goFav(${f.lat},${f.lon})"><div style="font-size:22px;">⛽</div><div class="pi-info"><div class="pi-name">${f.name}</div><div class="pi-meta">${f.address||'Indirizzo non disponibile'}</div></div><button class="delbtn" onclick="event.stopPropagation();rmFav('${f.id}')">🗑️</button></div>`;});}
  h+=`<div class="prof-sec" style="margin-top:16px;">📝 Rifornimenti (${logs.length})</div>`;
  if(!logs.length){h+='<div style="color:var(--label3);font-size:13px;">Nessun rifornimento registrato.</div>';}
  else{logs.slice(0,50).forEach(l=>{h+=`<div class="prof-item"><div style="font-size:20px;">${l.fuel==='benzina'?'🟢':'🔵'}</div><div class="pi-info"><div class="pi-name">${l.stationName}</div><div class="pi-meta">${l.date} · ${l.fuel} · ${'⭐'.repeat(l.stars)}${l.notes?` · "${l.notes}"`:''}</div></div><button class="delbtn" onclick="rmLog(${l.id})">🗑️</button></div>`;});}
  h+='</div>';el.innerHTML=h;
}

function goFav(lat,lon){map.setView([lat,lon],15,{animate:true});setSheet('s-peek');}
function rmFav(id){delete favs[id];S.set('favs',favs);renderProfile();renderList();}
function rmLog(id){logs=logs.filter(l=>l.id!==id);S.set('logs',logs);renderProfile();}
</script>
</body>
</html>
